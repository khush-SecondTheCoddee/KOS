{% extends 'base.html' %}

{% block title %}Staff{% endblock %}

{% block content %}
  <h2>Staff</h2>
  <a href="{% url 'staff_create' %}">Add Staff</a>
  <ul>
    {% for staff in object_list %}
      <li>
        {{ staff.user.username }}
        <a href="{% url 'staff_update' staff.pk %}">Edit</a>
        <a href="{% url 'staff_delete' staff.pk %}">Delete</a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
